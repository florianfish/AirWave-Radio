<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="50%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <filter id="fg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFB700" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep Black Container -->
  <rect width="500" height="500" rx="95" fill="#0A0A0C"/>
  <rect x="14" y="14" width="472" height="472" rx="85" fill="none" stroke="url(#fg-gold)" stroke-width="8" stroke-opacity="0.85"/>

  <!-- Turntable Vinyl Grooves in Background -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#222226" stroke-width="2"/>
  <circle cx="250" cy="250" r="140" fill="none" stroke="#222226" stroke-width="2"/>

  <!-- FG. Brand in official bold font -->
  <g filter="url(#fg-glow)">
    <text x="250" y="275" 
          font-family="'Arial Black', 'Impact', sans-serif" 
          font-weight="900" 
          font-style="italic" 
          font-size="175" 
          fill="url(#fg-gold)" 
          text-anchor="middle" 
          letter-spacing="2">FG.</text>
  </g>

  <!-- Subtitle: RADIO FG / DJ RADIO / FEEL GOOD -->
  <rect x="100" y="345" width="300" height="38" rx="19" fill="#18181C" stroke="url(#fg-gold)" stroke-width="2"/>
  <text x="250" y="370" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="20" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="6">DJ RADIO</text>

  <text x="250" y="425" 
        font-family="'Montserrat', sans-serif" 
        font-weight="800" 
        font-size="20" 
        fill="url(#fg-gold)" 
        text-anchor="middle" 
        letter-spacing="5">FEEL GOOD</text>
</svg>
