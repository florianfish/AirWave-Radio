<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fip-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2007A"/>
      <stop offset="100%" stop-color="#9C0054"/>
    </linearGradient>
  </defs>
  <!-- Background Circle Badge -->
  <rect width="500" height="500" rx="90" fill="url(#fip-bg)"/>
  
  <!-- Outer Ring -->
  <circle cx="250" cy="220" r="130" fill="none" stroke="#FFFFFF" stroke-width="18"/>
  <circle cx="250" cy="220" r="80" fill="#FFFFFF"/>
  <circle cx="250" cy="220" r="45" fill="#E2007A"/>
  
  <!-- FIP Text -->
  <text x="250" y="415" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="64" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="12">FIP</text>
</svg>
