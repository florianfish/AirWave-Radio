<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rtl2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00529B"/>
      <stop offset="100%" stop-color="#002D59"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="500" height="500" rx="90" fill="url(#rtl2-bg)"/>
  
  <!-- Red accent shape behind text -->
  <rect x="70" y="140" width="360" height="220" rx="40" fill="#E30613"/>
  
  <!-- RTL text -->
  <text x="220" y="295" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-weight="900" 
        font-size="120" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="-3">RTL</text>
        
  <!-- Number 2 in yellow/white -->
  <text x="360" y="300" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-weight="900" 
        font-size="140" 
        fill="#FFD200" 
        text-anchor="middle">2</text>
  
  <!-- Tagline -->
  <text x="250" y="415" 
        font-family="'Montserrat', sans-serif" 
        font-weight="700" 
        font-size="28" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="4">LE SON POP-ROCK</text>
</svg>
